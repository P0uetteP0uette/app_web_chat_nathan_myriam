<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Chat App</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="/css/chat-popup.css">
</head>
<body>

<div id="chat-page">
    
    <div id="sidebar">
        <h3>👥 Utilisateurs</h3>
        
<div id="current-user">
            Moi : <b th:text="${username}">Invité</b>
            <select id="status-select" onchange="sendStatusChange()">
                <option value="ONLINE">En ligne</option>
                <option value="BUSY">Occupé</option>
                <option value="AWAY">Absent</option>
            </select>

            <button id="sound-toggle-btn" onclick="toggleSound()" style="margin-top: 10px; width: 100%; padding: 5px; background: none; border: 1px solid #7f8c8d; color: #ecf0f1; border-radius: 4px; cursor: pointer; font-size: 0.9em; display: flex; align-items: center; justify-content: center; gap: 5px;">
                <i id="sound-icon" class="bi bi-volume-up-fill"></i> 
                <span id="sound-text">Son: ON</span>
            </button>
        </div>

        <ul id="users-list">
        </ul>
        
        <div style="margin-top: auto; padding-top: 20px; border-top: 1px solid #ddd;">
            
            <a href="/find-friends" style="display: block; width: 100%; background: #3498db; color: white; padding: 10px; border-radius: 5px; text-decoration: none; text-align: center; font-weight: bold; margin-bottom: 10px; transition: background 0.3s;">
                <i class="bi bi-person-plus-fill"></i> Trouver des amis
            </a>

            <form th:action="@{/logout}" method="post">
                <button type="submit" style="width: 100%; background: #e74c3c; padding: 10px; border:none; color:white; border-radius:5px; cursor:pointer; font-weight: bold;">
                    Déconnexion
                </button>
            </form>
        </div>
    </div>

    <div id="chat-container">
        
        <div id="chat-header-container">
            <h2 id="chat-header">Chat Général</h2>
        </div>

        <div id="chat-box">
        </div>

        <div id="message-input-area">
            <div id="typing-indicator" style="height: 20px; font-size: 0.8em; color: #888; font-style: italic; margin-left: 10px;">
            </div>
            <div class="input-wrapper">
                <input type="text" id="message" placeholder="Envoyer un message..." autocomplete="off" />
                <button id="send-btn" onclick="sendMessage()">➤</button>
            </div>
        </div>

    </div>
</div>

<script th:inline="javascript">
    /*<![CDATA[*/
    var currentUserGlobal = /*[[${username}]]*/ 'Invité';
    console.log("✅ Variable globale chargée : " + currentUserGlobal);
    /*]]>*/
</script>

<div id="popup-window" style="display: none;">
    
    <div class="chat-header" onclick="closeChat()">
        <span>Discussion avec <span id="popup-friend-name">...</span></span>
        <i class="bi bi-x-lg"></i>
    </div>
    
    <div id="popup-chat-body" class="chat-body"></div>
    
    <div id="private-typing-indicator" style="height: 20px; font-size: 0.75em; color: #888; font-style: italic; padding-left: 15px; min-height: 20px;"></div>

    <div class="chat-footer">
        <input type="text" id="popup-chat-input" class="form-control form-control-sm" placeholder="Message..." onkeypress="handleKeyPress(event)">
        <button class="btn btn-primary btn-sm" onclick="sendPrivateMessage()">➤</button>
    </div>
</div>

<audio id="notification-sound" src="/sounds/notification.mp3" preload="auto"></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script src="/js/chat.js"></script>
<script src="/js/chat-popup.js"></script>

</body>
</html>
