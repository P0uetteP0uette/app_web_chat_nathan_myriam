<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription - ChatApp</title>
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="container">
        
        <div class="alert-box">
            <p th:if="${error}" class="error-msg" th:text="${error}"></p>
        </div>

        <h2>Créer un compte</h2>

        <form action="/register" method="post">
            <input type="text" name="username" placeholder="Choisissez un pseudo" required>
            <input type="password" name="password" placeholder="Mot de passe complexe" required>
            <button type="submit">S'inscrire</button>
        </form>
        
        <a href="/">Retour à l'accueil</a>
    </div>
</body>
</html>
