spring.application.name=chatapp

# --- Configuration de la base de données ---
# J'ai remis le saut de ligne ici !
spring.datasource.url=jdbc:mysql://localhost:3306/chatapp_db?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

# --- Configuration JPA (Hibernate) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
# Cette ligne est souvent suffisante, pas besoin de spécifier le dialecte deux fois
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# --- Encodage ---
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true

# --- Configuration MailTrap ---
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
